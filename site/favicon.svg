<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1c212e"/>
      <stop offset="100%" stop-color="#0f121c"/>
    </linearGradient>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="2.5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <rect x="10" y="10" width="108" height="108" rx="28" fill="url(#bg)" stroke="rgba(255,255,255,0.14)" stroke-width="1.5"/>
  <!-- Translucent panes matching generate-icon.swift -->
  <rect x="20.5" y="20.5" width="42" height="87" rx="5.5" fill="rgba(56, 158, 250, 0.28)"/>
  <rect x="68.5" y="20.5" width="39" height="40.5" rx="5.5" fill="rgba(102, 199, 255, 0.22)"/>
  <rect x="68.5" y="67" width="39" height="40.5" rx="5.5" fill="rgba(158, 122, 250, 0.24)"/>
  <!-- Glowing vertical & horizontal seams -->
  <g stroke="#57ccff" stroke-width="3.2" stroke-linecap="round" filter="url(#glow)">
    <line x1="65.5" y1="20.5" x2="65.5" y2="107.5"/>
    <line x1="65.5" y1="64" x2="107.5" y2="64"/>
  </g>
  <!-- Center grip pill -->
  <rect x="62" y="51.2" width="7" height="25.6" rx="3.5" fill="#f0faff"/>
</svg>
